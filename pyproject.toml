[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralpack"
version = "0.1.0"
description = "Experimental incremental context compiler and measured reuse planner"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
tokenizers = ["tokenizers==0.22.2"]
experiments = ["torch==2.8.0", "transformers==4.57.6", "safetensors==0.6.2", "numpy==2.2.6", "psutil==7.0.0", "matplotlib==3.10.6", "urllib3==2.7.0", "click==8.5.0", "tiktoken==0.12.0"]
dev = ["pytest==8.4.2", "ruff==0.12.12"]

[project.scripts]
npk = "npk.cli:main"

[tool.setuptools.packages.find]
include = ["npk*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
